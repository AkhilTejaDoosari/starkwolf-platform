---
- name: Bootstrap Starkwolf Docker host
  hosts: starkwolf_hosts
  become: true

  vars:
    starkwolf_user: starkwolf
    starkwolf_root: /opt/starkwolf

  tasks:
    - name: Install required base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - jq
          - rsync
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Docker is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure Starkwolf user exists
      ansible.builtin.user:
        name: "{{ starkwolf_user }}"
        shell: /bin/bash
        groups: docker
        append: true
        state: present

    - name: Ensure Starkwolf root directory exists
      ansible.builtin.file:
        path: "{{ starkwolf_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Verify Docker
      ansible.builtin.command:
        cmd: docker version
      changed_when: false

    - name: Verify Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false
