global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'recipient@example.com'
  smtp_auth_username: 'recipient@example.com'
  smtp_auth_password_file: '/run/secrets/smtp-password'
  smtp_require_tls: true

route:
  receiver: starkwolf-email
  group_by:
    - alertname
    - severity
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: starkwolf-email
    email_configs:
      - to: 'recipient@example.com'
        send_resolved: true
        headers:
          Subject: '[Starkwolf] {{ .Status | toUpper }} - {{ .CommonLabels.alertname }}'
        text: |
          Starkwolf monitoring alert

          Status: {{ .Status }}
          Alert: {{ .CommonLabels.alertname }}
          Severity: {{ .CommonLabels.severity }}

          {{ range .Alerts }}
          Summary: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Started: {{ .StartsAt }}
          {{ end }}
