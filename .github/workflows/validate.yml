name: Validate Starkwolf

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        working-directory: docker
        run: docker compose --env-file ../.env.ci config -q

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done

      - name: Install Ansible
        run: python3 -m pip install --user ansible-core

      - name: Validate Ansible syntax
        working-directory: ansible
        run: ansible-playbook --syntax-check playbook.yml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform initialization
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validation
        run: terraform -chdir=terraform validate

      - name: Validate Renovate configuration
        run: npx --yes --package renovate -- renovate-config-validator --strict

